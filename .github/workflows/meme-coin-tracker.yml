name: Meme Coin Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan meme coins and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be configured"
            exit 1
          fi

          markets=$(curl --fail --silent --show-error --retry 2 \
            "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&category=meme&order=volume_desc&per_page=100&page=1&sparkline=false&price_change_percentage=24h,7d")
          trending=$(curl --fail --silent --show-error --retry 2 \
            "https://api.coingecko.com/api/v3/search/trending")

          rows=$(jq -r --argjson trending "$trending" '
            ($trending.coins // [] | map(.item.id)) as $trending_ids |
            map(select((.market_cap // 0) >= 20000000 and (.total_volume // 0) >= 1000000)) |
            map(. + {score: (((if (.id | IN($trending_ids[])) then 2 else 0 end) +
              (if (.price_change_percentage_24h // -999) > 0 then 1 else 0 end) +
              (if (.price_change_percentage_7d_in_currency // -999) > 0 then 1 else 0 end) +
              (if ((.total_volume // 0) / (.market_cap // 1)) >= 0.1 then 2 else 0 end))}) |
            sort_by(-.score, -(.total_volume // 0)) | .[0:5] |
            .[] | "- \(.symbol | ascii_upcase) (\(.name)): $\(.current_price) | 24h \((.price_change_percentage_24h // 0) | round)% | 7d \((.price_change_percentage_7d_in_currency // 0) | round)% | volume $\((.total_volume / 1000000) | round)M | narrative proxy: \(if (.id | IN($trending_ids[])) then \"trending + liquid\" else \"liquid + active\" end)"' <<<"$markets")

          if [[ -z "$rows" ]]; then
            message="Meme Coin Tracker — no candidates passed the $20M market-cap and $1M daily-volume filters today."
          else
            message="Meme Coin Tracker — $(date -u +%Y-%m-%d)\n\nCandidates with the strongest current price, volume, and search-interest signals:\n$rows\n\nThis is a market-data screen, not financial advice. Check the chart, liquidity, contract, and narrative before acting."
          fi

          curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"